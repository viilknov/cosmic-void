<!DOCTYPE html>
<html lang="ru">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; overflow: hidden; background: #010408;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            touch-action: none; overscroll-behavior: none;
        }
        #gameCanvas { display: block; touch-action: none; }

        #ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            color: #fff; font-size: 15px; font-weight: bold; pointer-events: none; z-index: 5;
        }
        .ui-box { background: rgba(3, 15, 25, 0.85); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(0, 225, 255, 0.4); }
        #comboText { color: #ffcc00; font-size: 20px; min-width: 100px; text-align: center; font-weight: 900; opacity: 0; transition: opacity 0.2s; }

        .icon-btn {
            position: absolute; pointer-events: auto; cursor: pointer;
            background: rgba(3, 15, 25, 0.85); color: #fff; border: 1px solid rgba(0,225,255,0.4);
            border-radius: 50%; width: 40px; height: 40px; font-size: 18px;
            display: flex; align-items: center; justify-content: center; z-index: 5;
        }

        #actionControls {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 12px; pointer-events: auto; z-index: 10;
        }
        .control-btn {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(3, 20, 35, 0.85); border: 2px solid #00f2fe;
            color: #fff; font-size: 20px; display: flex; align-items: center;
            justify-content: center; cursor: pointer;
            box-shadow: 0 0 12px rgba(0,242,254,0.3); touch-action: manipulation;
            position: relative;
        }
        .control-btn:active { transform: scale(0.92); background: rgba(0, 242, 254, 0.3); }

        #portalBarContainer {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 320px; height: 16px; background: rgba(0,20,30,0.8);
            border-radius: 10px; border: 1px solid #00f2fe; overflow: hidden; pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); z-index: 5;
        }
        #portalBar { width: 0%; height: 100%; background: linear-gradient(90deg, #00f2fe, #ff0844); transition: width 0.2s; }
        #portalText {
            position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
            color: #00f2fe; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; pointer-events: none; text-shadow: 0 0 8px #00f2fe; font-weight: bold; z-index: 5;
            white-space: nowrap;
        }

        #minimapWrapper {
            position: absolute; top: 70px; right: 15px;
            display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 5;
        }
        #minimap {
            width: 110px; height: 110px; background: rgba(3, 12, 22, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.5); border-radius: 50%; overflow: hidden;
        }
        #galaxyRecordBox {
            margin-top: 6px; background: rgba(3, 15, 25, 0.85); padding: 4px 8px;
            border-radius: 8px; border: 1px solid rgba(255, 204, 0, 0.5);
            color: #ffcc00; font-size: 11px; font-weight: bold; text-align: center;
        }

        #startMenu, #gameOver, #leaderboardPanel, #keybindsModal, #pauseMenu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; text-align: center; background: rgba(3, 10, 20, 0.95); padding: 25px 30px;
            border-radius: 20px; border: 2px solid #00f2fe; box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            z-index: 20; width: 340px; max-height: 90vh; overflow-y: auto;
        }
        #gameOver { border-color: #ff0844; box-shadow: 0 0 30px #ff0844; display: none; }
        #leaderboardPanel, #keybindsModal, #pauseMenu { display: none; }
        .shop-item, .keybind-item {
            display: flex; justify-content: space-between; align-items: center;
            margin: 8px 0; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 10px;
        }
        .shop-btn, .keybind-btn {
            background: #00f2fe; color: #000; border: none; padding: 5px 12px; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .shop-btn:hover, .keybind-btn:hover { background: #4facfe; }
        .keybind-btn.listening { background: #ffcc00; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #dailyBonusToast, #bossWarningToast {
            position: absolute; top: 22%; left: 50%; transform: translateX(-50%);
            background: rgba(3, 10, 20, 0.97); border: 2px solid #ffcc00; border-radius: 16px;
            padding: 18px 28px; text-align: center; color: #fff; z-index: 30; display: none;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
        }
        .action-btn {
            margin-top: 12px; padding: 12px 25px; font-size: 16px; font-weight: bold;
            background: linear-gradient(45deg, #00f2fe, #ff0844); color: white; border: none;
            border-radius: 20px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,242,254,0.4); width: 100%;
        }
    </style>
</head>

                core: '#f7edff',
                armColor: 'rgba(170, 0, 255, 0.15)',
                planet: ['#4a2b6e', '#2c1642', '#160922'],
                starTypes: ['#c279ff', '#ffffff', '#8000ff', '#ff79b1']
            }
        ];
        function getGalaxyPalette(g) { return GALAXY_PALETTES[(g - 1) % GALAXY_PALETTES.length]; }

        const GALAXY_NAMES = {
            ru: ['Туманность Пепла', 'Пояс Раскола', 'Огненный Рубеж', 'Изумрудные Просторы', 'Пурпурная Бездна'],
            en: ['Ashfall Nebula', 'Rift Belt', 'Ember Frontier', 'Emerald Expanse', 'Violet Abyss']
        };
        function getGalaxyName(g) {
            const list = GALAXY_NAMES[currentLang] || GALAXY_NAMES.en;
            return list[(g - 1) % list.length];
        }

        const i18n = {
            ru: {
                titleMain: 'ТЕМНЫЙ КОСМОС', labelGems: '💎 Кристаллы:',
                upgStartMass: 'Начальная масса', upgSpeed: 'Скорость', upgGemChance: 'Шанс кристалла',
                upgBoostCooldown: 'Кулдаун ускорения', upgAbsorbCooldown: 'Кулдаун поглощения', upgStealthCooldown: 'Кулдаун невидимости',
                level: 'Ур.', btnStart: 'В БОЙ!', btnBuyPack: '💎 Купить набор кристаллов',
                portalFill: 'Заполните массу для перехода',
                portalReady: '🌀 ПОРТАЛ РЯДОМ! ВОЙДИТЕ ДЛЯ ПЕРЕХОДА',
                comboSuffix: 'КОМБО!', titleGameOver: 'УНИЧТОЖЕН!',
                labelFinalGalaxy: 'Пройдено галактик:', labelFinalGems: 'Собрано кристаллов:',
                btnReviveText: 'Смотреть рекламу и возродиться',
                labelDoubleGemsText: 'Удвоить кристаллы за рекламу', btnMenu: 'В Меню',
                labelGalaxy: '🌌 Галактика:', enemyLevelShort: 'Ур.', newGalaxy: 'Новая галактика',
                labelLeaderboard: 'Таблица лидеров', labelLeaderboardTitle: '🏆 Таблица лидеров',
                labelKeybinds: 'Управление', labelKeybindsTitle: '⌨️ Настройка клавиш',
                btnCloseKeybinds: 'Сохранить', pressAnyKey: 'Нажмите клавишу...',
                actBoost: 'Ускорение', actAbsorb: 'Поглощение', actStealth: 'Прозрачность', actPause: 'Пауза',
                btnCloseLeaderboard: 'Закрыть', leaderboardUnavailable: 'Таблица лидеров недоступна',
                leaderboardEmpty: 'Пока нет результатов', loading: 'Загрузка...',
                dailyBonusTitle: 'Бонус за вход!', streak: 'Серия:', labelBestGalaxy: 'Рекорд галактики:',
                bossLabel: 'БОСС', bossWarningTitle: 'Страж галактики!',
                bossWarningText: 'Охраняет портал неподалёку — смотрите на радар и стрелку у края экрана.',
                titlePause: 'ПАУЗА', btnResume: 'Продолжить'
            },
            en: {
                titleMain: 'DARK SPACE', labelGems: '💎 Crystals:',
                upgStartMass: 'Starting mass', upgSpeed: 'Speed', upgGemChance: 'Gem chance',
                upgBoostCooldown: 'Boost cooldown', upgAbsorbCooldown: 'Absorb cooldown', upgStealthCooldown: 'Stealth cooldown',
                level: 'Lv.', btnStart: 'FIGHT!', btnBuyPack: '💎 Buy crystal pack',
                portalFill: 'Fill your mass to warp',
                portalReady: '🌀 PORTAL NEARBY! ENTER TO WARP',
                comboSuffix: 'COMBO!', titleGameOver: 'DESTROYED!',
                labelFinalGalaxy: 'Galaxies cleared:', labelFinalGems: 'Crystals collected:',
                btnReviveText: 'Watch ad to revive',
                labelDoubleGemsText: 'Double crystals for ad', btnMenu: 'Menu',
                labelGalaxy: '🌌 Galaxy:', enemyLevelShort: 'Lv.', newGalaxy: 'New galaxy',
                labelLeaderboard: 'Leaderboard', labelLeaderboardTitle: '🏆 Leaderboard',
                labelKeybinds: 'Controls', labelKeybindsTitle: '⌨️ Customize Keys',
                btnCloseKeybinds: 'Save', pressAnyKey: 'Press any key...',
                actBoost: 'Boost', actAbsorb: 'Absorb', actStealth: 'Stealth', actPause: 'Pause',
                btnCloseLeaderboard: 'Close', leaderboardUnavailable: 'Leaderboard unavailable',
                leaderboardEmpty: 'No results yet', loading: 'Loading...',
                dailyBonusTitle: 'Daily bonus!', streak: 'Streak:', labelBestGalaxy: 'Galaxy record:',
                bossLabel: 'BOSS', bossWarningTitle: 'Galaxy Guardian!',
                bossWarningText: 'Guarding the portal nearby — check the radar and the edge arrow.',
                titlePause: 'PAUSE', btnResume: 'Resume'
            }
        };
        function t(key) {
            const dict = i18n[currentLang] || i18n.en;
            return dict[key] !== undefined ? dict[key] : (i18n.en[key] || key);
        }

        function formatKeyName(code) {
            if (!code) return '?';
            if (code === 'Space') return 'Space';
            if (code === 'Escape') return 'Esc';
            if (code.startsWith('Key')) return code.slice(3);
            if (code.startsWith('Digit')) return code.slice(5);
            return code;
        }

        function updateTooltips() {
            document.getElementById('btnBoost').title = `${t('actBoost')} (${formatKeyName(keybinds.boost)})`;
            document.getElementById('btnAbsorb').title = `${t('actAbsorb')} (${formatKeyName(keybinds.absorb)})`;
            document.getElementById('btnStealth').title = `${t('actStealth')} (${formatKeyName(keybinds.stealth)})`;
        }

        function applyLocalization() {
            document.documentElement.lang = currentLang;
            document.getElementById('titleMain').innerText = t('titleMain');
            document.getElementById('labelGems').innerText = t('labelGems');
            document.getElementById('btnStart').innerText = t('btnStart');
            document.getElementById('btnBuyPack').innerText = t('btnBuyPack');
            document.getElementById('labelGalaxy').innerText = t('labelGalaxy');
            document.getElementById('titleGameOver').innerText = t('titleGameOver');
            document.getElementById('labelFinalGalaxy').innerText = t('labelFinalGalaxy');
            document.getElementById('labelFinalGems').innerText = t('labelFinalGems');
            document.getElementById('labelBestGalaxy').innerText = t('labelBestGalaxy');
            document.getElementById('labelReviveText').innerText = t('btnReviveText');
            document.getElementById('labelDoubleGemsText').innerText = t('labelDoubleGemsText');
            document.getElementById('btnMenu').innerText = t('btnMenu');
            document.getElementById('labelLeaderboard').innerText = t('labelLeaderboard');
            document.getElementById('labelLeaderboardTitle').innerText = t('labelLeaderboardTitle');
            document.getElementById('btnCloseLeaderboard').innerText = t('btnCloseLeaderboard');
            document.getElementById('labelKeybinds').innerText = t('labelKeybinds');
            document.getElementById('labelKeybindsTitle').innerText = t('labelKeybindsTitle');
            document.getElementById('btnCloseKeybinds').innerText = t('btnCloseKeybinds');
            document.getElementById('titlePause').innerText = t('titlePause');
            
            const elPortalText = document.getElementById('portalText');
            if (elPortalText && typeof portal !== 'undefined' && !portal) {
                elPortalText.innerText = t('portalFill');
            }
            updateTooltips();
            renderShop();
        }

        // ================= AUDIO =================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

        function playSound(type) {
            if (!soundOn || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'eat') {
                    osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'warp') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.8);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start(now); osc.stop(now + 0.8);
                } else if (type === 'levelup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'boss') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(500, now + 0.4);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0, now + 0.45);
                    osc.start(now); osc.stop(now + 0.45);
                } else if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'stealth') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'absorb') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(350, now + 0.5);
                    gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                }
            } catch(e) {}
        }

                    gems = data.gems || 0;
                    upgrades = Object.assign(defaultUpgrades(), data.upgrades || {});
                    soundOn = data.soundOn !== undefined ? data.soundOn : true;
                    lowGraphics = data.lowGraphics || false;
                    bestGalaxy = data.bestGalaxy || 0;
                    galaxyRecords = data.galaxyRecords || {};
                    lastLoginDate = data.lastLoginDate || null;
                    loginStreak = data.loginStreak || 0;
                    keybinds = Object.assign(defaultKeybinds(), data.keybinds || {});

                } catch (e) { console.warn('Yandex getData error', e); }
            }
            gems = parseInt(localStorage.getItem('cv_gems') || '0');
            upgrades = Object.assign(defaultUpgrades(), JSON.parse(localStorage.getItem('cv_upgrades') || '{}'));
            soundOn = localStorage.getItem('cv_sound') !== '0';
            lowGraphics = localStorage.getItem('cv_lowgfx') === '1';
            bestGalaxy = parseInt(localStorage.getItem('cv_best') || '0');
            galaxyRecords = JSON.parse(localStorage.getItem('cv_galaxy_records') || '{}');
            lastLoginDate = localStorage.getItem('cv_lastlogin') || null;
            loginStreak = parseInt(localStorage.getItem('cv_streak') || '0');

            localStorage.setItem('cv_lowgfx', lowGraphics ? '1' : '0');

        function buyUpgrade(type) {
            if (type === 'boostCooldown' && upgrades.boostCooldown >= 15) return;
            if (type === 'absorbCooldown' && upgrades.absorbCooldown >= 15) return;
            if (type === 'stealthCooldown' && upgrades.stealthCooldown >= 15) return;
            let cost = (upgrades[type] + 1) * 5;
            if (gems >= cost) { 
                gems -= cost; 
                upgrades[type]++; 
                saveMeta(); 

                // Применяем улучшения «на лету» к текущему игровому процессу
                if (type === 'speed' && player && player.cells.length > 0) {
                    player.moveSpeed = (4.2 + upgrades.speed * 0.4);
                }
                if (type === 'startMass' && player && player.cells.length > 0) {
                    player.cells[0].mass += 8;
                    updateUI();
                }
            }
        }

        function setupGalaxy() {
            targetMassForNextGalaxy = Math.floor(260 * Math.pow(1.42, galaxy - 1));
            let startMassVal = 10 + upgrades.startMass * 8;
            const moveSpeedVal = (4.2 + upgrades.speed * 0.4);

                cells: [{
                    x: 0, y: 0, vx: 0, vy: 0,
                    radius: 18, mass: startMassVal
                }],
                level: Math.floor(startMassVal / 10),
                moveSpeed: moveSpeedVal,
                invulnerableUntil: 0
            };

            foods = []; enemies = []; gemsItems = []; particles = []; spaceDust = []; portal = null; boss = null;

            updateUI();

        function generateBackground() {
            backgroundStars = []; backgroundNebulas = []; darkNebulas = []; spiralArms = []; spaceDust = [];
            const palette = getGalaxyPalette(galaxy);

            const starCount = lowGraphics ? 250 : 600;
            for (let i = 0; i < starCount; i++) {
                const color = palette.starTypes[Math.floor(Math.random() * palette.starTypes.length)];
                const isMajorStar = Math.random() < 0.05;
                backgroundStars.push({
                    x: (Math.random() - 0.5) * 6500, y: (Math.random() - 0.5) * 6500,
                    size: isMajorStar ? Math.random() * 2.5 + 2.0 : Math.random() * 1.5 + 0.4,
                    alpha: Math.random() * 0.7 + 0.3,
                    color: color,
                    phase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 0.01 + Math.random() * 0.03,
                    hasFlare: isMajorStar && !lowGraphics
                });
            }

            const nebulaCount = lowGraphics ? 10 : 22;
            for (let i = 0; i < nebulaCount; i++) {
                backgroundNebulas.push({
                    x: (Math.random() - 0.5) * 5500, y: (Math.random() - 0.5) * 5500,
                    radius: 500 + Math.random() * 800,
                    color: palette.nebula[i % palette.nebula.length]
                });
            }

            if (!lowGraphics) {
                for (let i = 0; i < 12; i++) {
                    darkNebulas.push({
                        x: (Math.random() - 0.5) * 5000, y: (Math.random() - 0.5) * 5000,
                        radius: 350 + Math.random() * 600,
                        rotation: Math.random() * Math.PI * 2
                    });
                }
            }

            const armCount = 2;
            const pointsPerArm = lowGraphics ? 40 : 90;
            for (let arm = 0; arm < armCount; arm++) {
                const armAngleOffset = (arm * Math.PI * 2) / armCount;
                for (let i = 0; i < pointsPerArm; i++) {
                    const distance = 80 + i * 35;
                    const angle = armAngleOffset + i * 0.12;
                    const spreadX = (Math.random() - 0.5) * (distance * 0.35);
                    const spreadY = (Math.random() - 0.5) * (distance * 0.35);

                    spiralArms.push({
                        x: Math.cos(angle) * distance + spreadX,
                        y: Math.sin(angle) * distance + spreadY,
                        radius: 80 + Math.random() * 120,
                        alpha: Math.max(0.02, 0.18 - (i / pointsPerArm) * 0.16)
                    });
                }
            }

            for (let i = 0; i < 120; i++) {
                spaceDust.push({
                    x: (Math.random() - 0.5) * 4500, y: (Math.random() - 0.5) * 4500,
                    size: Math.random() * 2 + 0.8,
                    color: palette.starTypes[i % palette.starTypes.length]
                });
            }

            planets = [];
            const planetCount = 2 + Math.floor(Math.random() * 2);
            for (let i = 0; i < planetCount; i++) {
                planets.push({
                    x: (Math.random() - 0.5) * 4000, y: (Math.random() - 0.5) * 4000,
                    radius: 120 + Math.random() * 180, colors: palette.planet,
                    hasRing: Math.random() < 0.6, ringAngle: (Math.random() - 0.5) * 0.8
                });
            }

            farGalaxies = [];
            for (let i = 0; i < 4; i++) {
                farGalaxies.push({
                    x: (Math.random() - 0.5) * 6000, y: (Math.random() - 0.5) * 6000,
                    radius: 120 + Math.random() * 110, rotation: Math.random() * Math.PI,
                    colorCore: palette.core, colorEdge: palette.nebula[0]
                });
            }
        }

        function activateBoost() {
            if (isGameOver || !player.cells || player.cells.length === 0) return;
            const now = performance.now();
            if (now < boostReadyAt) return;
            if (getTotalMass() < 15) return;

            boostActiveUntil = now + 3000; 
            boostReadyAt = now + getBoostCooldownMs();
            playSound('pop');
        }

        function activateAbsorb() {
            if (isGameOver || !player.cells || player.cells.length === 0) return;
            const now = performance.now();
            if (now < absorbReadyAt) return;

            absorbActiveUntil = now + 3000; 
            absorbReadyAt = now + getAbsorbCooldownMs();
            playSound('absorb');
        }

        function activateStealth() {
            if (isGameOver || !player.cells || player.cells.length === 0) return;
            const now = performance.now();
            if (now < stealthReadyAt) return;

            stealthActiveUntil = now + 3000; 
            stealthReadyAt = now + getStealthCooldownMs(); 
            playSound('stealth');
        }

        function maintainInfiniteWorld() {
            const spawnRadiusMin = 400; const spawnRadiusMax = 1100; const maxDespawnDist = 1600;
            const center = getPlayerCenter();

            for (let i = foods.length - 1; i >= 0; i--) {
                if (Math.hypot(foods[i].x - center.x, foods[i].y - center.y) > maxDespawnDist) {
                    foods.splice(i, 1);
                }
            }

            const angleToMouse = Math.atan2(screenMouse.y - height / 2, screenMouse.x - width / 2);

            while (foods.length < 250) {
                const angle = Math.random() < 0.7 ? angleToMouse + (Math.random() - 0.5) * 1.5 : Math.random() * Math.PI * 2;
                const dist = spawnRadiusMin + Math.random() * (spawnRadiusMax - spawnRadiusMin);

                foods.push({
                    x: center.x + Math.cos(angle) * dist, y: center.y + Math.sin(angle) * dist,
                    radius: Math.random() < 0.2 ? 5.5 : 2.5, type: Math.random() < 0.2 ? 'comet' : 'dust',
                    color: Math.random() < 0.2 ? '#ffb199' : '#00f2fe', vx: 0, vy: 0
                });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                if (Math.hypot(enemies[i].x - center.x, enemies[i].y - center.y) > maxDespawnDist) {
                    enemies.splice(i, 1);
                }
            }

            const galaxySpeedMultiplier = 1 + (galaxy - 1) * 0.03;

            while (enemies.length < 32) {
                const randType = Math.random();
                const angle = Math.random() < 0.75 ? angleToMouse + (Math.random() - 0.5) * 1.8 : Math.random() * Math.PI * 2;
                const dist = spawnRadiusMin + 200 + Math.random() * (spawnRadiusMax - spawnRadiusMin);

                let enemyType = 'normal';
                let enemyLevel = Math.max(1, Math.floor(player.level - (Math.random() * 4 + 1)));

                if (randType < 0.25) {
                    enemyType = 'hunter';
                    enemyLevel = Math.max(1, Math.floor(player.level + (Math.random() * 4 - 1)));
                } else if (randType < 0.38) {
                    enemyType = 'mina';
                    enemyLevel = Math.floor(player.level * 1.3) + 2;
                } else if (randType < 0.50) {
                    enemyType = 'scaredy';
                    enemyLevel = Math.max(1, player.level - 2);
                } else if (randType < 0.62) {
                    enemyType = 'stealth';
                    enemyLevel = player.level + 1;
                }

                let radius = Math.min(12 + enemyLevel * 1.8, 55);
                if (enemyType === 'mina') radius = 28;

                let rawSpeed = (enemyType === 'scaredy' ? 4.8 : (enemyType === 'hunter' ? 3.8 : 2.6));

                enemies.push({
                    x: center.x + Math.cos(angle) * dist, y: center.y + Math.sin(angle) * dist,
                    radius: radius, level: enemyLevel, mass: enemyLevel * 10,
                    moveSpeed: rawSpeed * galaxySpeedMultiplier,
                    type: enemyType, swarmPhase: Math.random() * Math.PI * 2
                });
            }
        }

        function getPlayerCenter() {
            if (!player.cells || player.cells.length === 0) return { x: 0, y: 0 };
            let sumX = 0, sumY = 0;
            player.cells.forEach(c => { sumX += c.x; sumY += c.y; });
            return { x: sumX / player.cells.length, y: sumY / player.cells.length };
        }

        function getTotalMass() {
            if (!player.cells) return 0;
            return player.cells.reduce((sum, c) => sum + c.mass, 0);
        }

        function spawnGem(x, y) { gemsItems.push({ x: x, y: y, radius: 8 }); }

        function triggerCombo() {
            comboCount++; clearTimeout(comboTimer);
            comboText.innerText = `x${comboCount} ${t('comboSuffix')}`; comboText.style.opacity = '1';
            if (comboCount > 0 && comboCount % 5 === 0) {
                if (player.cells[0]) player.cells[0].mass += comboCount * 0.5;
                updateUI();
            }
            comboTimer = setTimeout(() => { comboCount = 0; comboText.style.opacity = '0'; }, 1500);
        }

        function triggerLevelUpEffect() {
            playSound('levelup');
            levelUpFlash = 1.0;
        }

        function updateUI() {
            const totalMass = getTotalMass();
            const newLevel = Math.floor(totalMass / 10);
            if (newLevel > player.level) triggerLevelUpEffect();
            player.level = newLevel;

            if (!galaxyRecords[galaxy] || newLevel > galaxyRecords[galaxy]) {
                galaxyRecords[galaxy] = newLevel;
                saveMeta();
            }
            recordValue.innerText = galaxyRecords[galaxy] || 0;

            player.cells.forEach(c => {
                c.radius = Math.min(16 + Math.floor(c.mass / 10) * 1.5, 55);
            });

            massText.innerText = Math.floor(totalMass);
            gemText.innerText = gems; galaxyText.innerText = `${galaxy} — ${getGalaxyName(galaxy)}`;

            if (!portal) {
                let progress = (totalMass / targetMassForNextGalaxy) * 100;
                portalBar.style.width = Math.min(progress, 100) + '%';
                if (totalMass >= targetMassForNextGalaxy) spawnPortal();
            }
        }

        function spawnPortal() {
            portalText.innerText = t('portalReady');
            portalText.style.color = "#00f2fe"; portalBar.style.width = '100%';

            const center = getPlayerCenter();
            const angle = Math.atan2(screenMouse.y - height / 2, screenMouse.x - width / 2);
            portal = { x: center.x + Math.cos(angle) * 200, y: center.y + Math.sin(angle) * 200, radius: 50 };

            if (galaxy % 3 === 0 && !boss) {
                const expectedLevel = Math.floor(targetMassForNextGalaxy / 10);
                const bossLevel = Math.ceil(expectedLevel * 1.25);
                const bossAngle = angle + (Math.random() - 0.5) * 1.0;
                const bossDist = 480;
                const bx = center.x + Math.cos(bossAngle) * bossDist;
                const by = center.y + Math.sin(bossAngle) * bossDist;
                boss = {
                    x: bx, y: by, homeX: bx, homeY: by,
                    radius: Math.min(30 + bossLevel * 1.8, 90),
                    level: bossLevel, mass: bossLevel * 10,
                    moveSpeed: (2.8 + (galaxy - 1) * 0.2),
                    spawnTime: performance.now()
                };
                playSound('boss');
                showBossWarningToast();
            }
        }

        function triggerWarp() {
            isWarping = true; playSound('warp'); warpTimer = 0;
            setTimeout(() => {
                galaxy++;
                player.cells.forEach(c => c.mass *= 0.65);
                const bonusGems = 3 + galaxy * 2;
                gems += bonusGems; saveMeta();

                setupGalaxy();
                player.invulnerableUntil = performance.now() + 2500;
                isWarping = false;

                portalText.innerText = `${t('newGalaxy')} ${galaxy}! +${bonusGems} 💎`;
                portalText.style.color = "#00ff88";
                clearTimeout(newGalaxyToastTimer);
                newGalaxyToastTimer = setTimeout(() => {
                    portalText.innerText = t('portalFill');
                    portalText.style.color = "#00f2fe";
                }, 2500);
            }, 800);
        }

        function isOnScreen(x, y, margin) {
            return x + margin > camera.x && x - margin < camera.x + width &&
                   y + margin > camera.y && y - margin < camera.y + height;
        }

        function update(dt) {
            if (isGameOver || isPaused) return;
            if (isWarping) { warpTimer += 0.05 * dt; return; }

            if (shakeTime > 0) shakeTime -= dt;
            if (levelUpFlash > 0) levelUpFlash = Math.max(0, levelUpFlash - 0.03 * dt);

            maintainInfiniteWorld();

            const center = getPlayerCenter();
            camera.x = center.x - width / 2; camera.y = center.y - height / 2;

            const nowTime = performance.now();
            const isStealthActive = nowTime < stealthActiveUntil;
            const isAbsorbActive = nowTime < absorbActiveUntil;

            let speedMult = 1;
            if (nowTime < boostActiveUntil) {
                speedMult = 1.8;
                if (player.cells[0] && Math.random() < 0.4) {
                    const backAngle = Math.atan2(screenMouse.y - height / 2, screenMouse.x - width / 2) + Math.PI;
                    foods.push({
                        x: player.cells[0].x + Math.cos(backAngle) * player.cells[0].radius,
                        y: player.cells[0].y + Math.sin(backAngle) * player.cells[0].radius,
                        radius: 2.5, type: 'dust', color: '#00f2fe', vx: 0, vy: 0
                    });
                }
            }

            let targetDx = 0;
            let targetDy = 0;

            if (keyboardMove.x !== 0 || keyboardMove.y !== 0) {
                const len = Math.hypot(keyboardMove.x, keyboardMove.y);
                targetDx = keyboardMove.x / len;
                targetDy = keyboardMove.y / len;
            } else {
                const mouseWorldX = camera.x + screenMouse.x;
                const mouseWorldY = camera.y + screenMouse.y;
                const dxM = mouseWorldX - player.cells[0].x; 
                const dyM = mouseWorldY - player.cells[0].y;
                const distM = Math.hypot(dxM, dyM);
                if (distM > 5) {
                    targetDx = dxM / distM;
                    targetDy = dyM / distM;
                }
            }

            const galaxySpeedFactor = Math.pow(1.02, galaxy - 1);

            for (let i = 0; i < player.cells.length; i++) {
                let cell = player.cells[i];

                if (cell.vx || cell.vy) {
                    cell.x += cell.vx * dt;
                    cell.y += cell.vy * dt;
                    cell.vx *= Math.pow(0.9, dt);
                    cell.vy *= Math.pow(0.9, dt);
                    if (Math.hypot(cell.vx, cell.vy) < 0.1) { cell.vx = 0; cell.vy = 0; }
                }

                if (targetDx !== 0 || targetDy !== 0) {
                    const step = player.moveSpeed * galaxySpeedFactor * speedMult * dt;
                    cell.x += targetDx * step;
                    cell.y += targetDy * step;
                }

                particles.push({
                    x: cell.x + (Math.random() - 0.5) * 8, y: cell.y + (Math.random() - 0.5) * 8,
                    radius: Math.random() * 2.5 + 1, alpha: 1
                });
            }

            if (lowGraphics && particles.length > 30) particles.splice(0, particles.length - 30);
            particles.forEach((p, i) => { p.alpha -= 0.04 * dt; if (p.alpha <= 0) particles.splice(i, 1); });

            if (!isStealthActive) {
                const absorbRadius = isAbsorbActive ? 220 : 0;

                for (let i = foods.length - 1; i >= 0; i--) {
                    const food = foods[i];
                    if (food.vx || food.vy) {
                        food.x += food.vx * dt; food.y += food.vy * dt;
                        food.vx *= Math.pow(0.92, dt); food.vy *= Math.pow(0.92, dt);
                    }

                    for (let cell of player.cells) {
                        const distP = Math.hypot(cell.x - food.x, cell.y - food.y);
                        
                        if (absorbRadius > 0 && distP < absorbRadius) {
                            food.x += ((cell.x - food.x) / distP) * 12 * dt;
                            food.y += ((cell.y - food.y) / distP) * 12 * dt;
                        } else if (distP < cell.radius + 15) {
                            food.x += ((cell.x - food.x) / distP) * 4 * dt;
                            food.y += ((cell.y - food.y) / distP) * 4 * dt;
                        }

                        if (distP < cell.radius) {
                            foods.splice(i, 1); playSound('eat'); triggerCombo();
                            cell.mass += food.type === 'comet' ? 3 : 1;
                            updateUI();
                            break;
                        }
                    }
                }

                for (let i = gemsItems.length - 1; i >= 0; i--) {
                    const gem = gemsItems[i];
                    for (let cell of player.cells) {
                        const distP = Math.hypot(cell.x - gem.x, cell.y - gem.y);
                        if (absorbRadius > 0 && distP < absorbRadius) {
                            gem.x += ((cell.x - gem.x) / distP) * 12 * dt;
                            gem.y += ((cell.y - gem.y) / distP) * 12 * dt;
                        }
                        if (distP < cell.radius) {
                            gemsItems.splice(i, 1); gems++; saveMeta(); playSound('eat');
                            break;
                        }
                    }
                }
            }

            if (portal && Math.hypot(center.x - portal.x, center.y - portal.y) < portal.radius + 20) {
                triggerWarp();
            }

            const gemDropChance = Math.min(0.6 + (upgrades.gemChance || 0) * 0.05, 0.95);
            const isInvulnerable = player.invulnerableUntil && nowTime < player.invulnerableUntil;

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e1 = enemies[i];
                if (!e1) continue;

                if (isAbsorbActive && !isStealthActive && player.level >= e1.level && e1.type !== 'mina') {
                    for (let cell of player.cells) {
                        const distToCell = Math.hypot(cell.x - e1.x, cell.y - e1.y);
                        if (distToCell < 220) {
                            e1.x += ((cell.x - e1.x) / distToCell) * 10 * dt;
                            e1.y += ((cell.y - e1.y) / distToCell) * 10 * dt;
                        }
                    }
                }

                let bestTarget = null;
                let minDistance = Math.min(420 + (galaxy - 1) * 25, 640);
                let isFleeing = false;

                if (!isStealthActive) {
                    let closestCell = player.cells[0];
                    let distToPlayer = Math.hypot(closestCell.x - e1.x, closestCell.y - e1.y);
                    for (let c of player.cells) {
                        let d = Math.hypot(c.x - e1.x, c.y - e1.y);
                        if (d < distToPlayer) { distToPlayer = d; closestCell = c; }
                    }

                    if (e1.type !== 'mina' && distToPlayer < minDistance) {
                        if (e1.type === 'scaredy') {
                            bestTarget = closestCell; minDistance = distToPlayer; isFleeing = true;
                        } else if (e1.level > player.level) {
                            bestTarget = closestCell; minDistance = distToPlayer;
                        } else if (e1.level < player.level && distToPlayer < 280) {
                            bestTarget = closestCell; minDistance = distToPlayer; isFleeing = true;
                        }
                    }
                }

                if (!bestTarget && e1.type !== 'mina') {
                    for (let j = 0; j < enemies.length; j++) {
                        if (i === j) continue;
                        const e2 = enemies[j];
                        if (!e2 || e2.type === 'mina') continue;
                        const distToE2 = Math.hypot(e2.x - e1.x, e2.y - e1.y);
                        if (distToE2 < minDistance) {
                            if (e1.level > e2.level) {
                                bestTarget = e2; minDistance = distToE2; isFleeing = false;
                            } else if (e1.level < e2.level && distToE2 < 250) {
                                bestTarget = e2; minDistance = distToE2; isFleeing = true;
                            }
                        }
                    }
                }

                if (bestTarget) {
                    const dx = bestTarget.x - e1.x; const dy = bestTarget.y - e1.y;
                    if (isFleeing) {
                        e1.x -= (dx / minDistance) * e1.moveSpeed * dt;
                        e1.y -= (dy / minDistance) * e1.moveSpeed * dt;
                    } else {
                        e1.x += (dx / minDistance) * e1.moveSpeed * dt;
                        e1.y += (dy / minDistance) * e1.moveSpeed * dt;
                    }
                } else if (e1.type !== 'mina') {
                    e1.wanderAngle = (e1.wanderAngle !== undefined ? e1.wanderAngle : Math.random() * Math.PI * 2) + (Math.random() - 0.5) * 0.08;
                    e1.x += Math.cos(e1.wanderAngle) * e1.moveSpeed * 0.35 * dt;
                    e1.y += Math.sin(e1.wanderAngle) * e1.moveSpeed * 0.35 * dt;
                }

                if (e1.type !== 'mina') {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (i === j || !enemies[i] || !enemies[j]) continue;
                        const e2 = enemies[j];
                        if (e2.type === 'mina') continue;
                        const distBetween = Math.hypot(e2.x - e1.x, e2.y - e1.y);
                        if (distBetween < e1.radius + e2.radius - 2 && e1.level > e2.level) {
                            e1.mass += e2.mass * 0.5;
                            e1.level = Math.floor(e1.mass / 10);
                            e1.radius = Math.min(12 + e1.level * 1.8, 55);
                            enemies.splice(j, 1);
                            if (j < i) i--;
                        }
                    }
                }

                if (!isStealthActive) {
                    for (let cellIdx = 0; cellIdx < player.cells.length; cellIdx++) {
                        let cell = player.cells[cellIdx];
                        if (enemies[i] && Math.hypot(cell.x - e1.x, cell.y - e1.y) < cell.radius + e1.radius - 2) {

                            if (e1.type === 'mina') {
                                if (cell.mass > 40) {
                                    cell.mass *= 0.7;
                                    cell.vx = -Math.cos(Math.atan2(e1.y - cell.y, e1.x - cell.x)) * 12;
                                    cell.vy = -Math.sin(Math.atan2(e1.y - cell.y, e1.x - cell.x)) * 12;
                                    enemies.splice(i, 1); playSound('boss');
                                    shakeTime = 8;
                                    updateUI();
                                } else if (!isInvulnerable) {
                                    handleGameOver();
                                }
                                break;
                            }

                            if (player.level >= e1.level) {
                                let bonusMass = e1.level * 4;
                                if (e1.type === 'scaredy') gems += 3;

                                if (Math.random() < gemDropChance) spawnGem(e1.x, e1.y);
                                cell.mass += bonusMass;
                                enemies.splice(i, 1);
                                playSound('eat'); triggerCombo(); updateUI();
                                break;
                            } else if (!isInvulnerable) {
                                handleGameOver();
                            }
                        }
                    }
                }
            }

            updateBoss(dt);
        }

        function updateBoss(dt) {
            if (!boss || isGameOver) return;
            const center = getPlayerCenter();
            const isStealthActive = performance.now() < stealthActiveUntil;

            for (let f = foods.length - 1; f >= 0; f--) {
                const food = foods[f];
                const d = Math.hypot(food.x - boss.x, food.y - boss.y);
                if (d < 260) {
                    food.x += ((boss.x - food.x) / d) * 3 * dt;
                    food.y += ((boss.y - food.y) / d) * 3 * dt;
                    if (d < boss.radius) {
                        foods.splice(f, 1);
                        boss.mass += 0.8;
                        boss.level = Math.floor(boss.mass / 10);
                        boss.radius = Math.min(30 + boss.level * 1.8, 90);
                    }
                }
            }

            const distToPlayer = Math.hypot(center.x - boss.x, center.y - boss.y);
            const distToHome = Math.hypot(boss.homeX - boss.x, boss.homeY - boss.y);

            if (!isStealthActive && distToPlayer < 420 && distToHome < 380) {
                const dx = center.x - boss.x, dy = center.y - boss.y;
                boss.x += (dx / distToPlayer) * boss.moveSpeed * dt;
                boss.y += (dy / distToPlayer) * boss.moveSpeed * dt;
            } else if (distToHome > 40) {
                const dx = boss.homeX - boss.x, dy = boss.homeY - boss.y;
                boss.x += (dx / distToHome) * boss.moveSpeed * dt;
                boss.y += (dy / distToHome) * boss.moveSpeed * dt;
            }

            if (!isStealthActive) {
                for (let cell of player.cells) {
                    if (Math.hypot(cell.x - boss.x, cell.y - boss.y) < cell.radius + boss.radius - 2) {
                        const isInvulnerableNow = player.invulnerableUntil && performance.now() < player.invulnerableUntil;
                        if (player.level >= boss.level) {
                            cell.mass += boss.level * 8;
                            const bossGems = Math.floor(Math.random() * (35 - 5 + 1)) + 5;
                            gems += bossGems; saveMeta();

                            triggerCombo(); playSound('boss'); levelUpFlash = 1.0;
                            boss = null; updateUI();
                        } else if (!isInvulnerableNow) {
                            handleGameOver();
                        }
                    }
                }
            }
        }

        function handleGameOver() {
            isGameOver = true;
            gameplayStop();
            if (galaxy > bestGalaxy) { bestGalaxy = galaxy; saveMeta(); }
            submitScore(galaxy);
            document.getElementById('finalGalaxy').innerText = `${galaxy} — ${getGalaxyName(galaxy)}`;
            document.getElementById('finalGems').innerText = gems;
            document.getElementById('finalBest').innerText = galaxyRecords[galaxy] || player.level;
            document.getElementById('btnRevive').style.display = reviveUsedThisLife ? 'none' : 'block';
            document.getElementById('btnDoubleGems').style.display = doubleGemsClaimed ? 'none' : 'block';
            gameOverUI.style.display = 'block';
        }

        function reviveWithAd() {
            if (reviveUsedThisLife) return;
            if (!ysdk || !ysdk.adv) { doRevive(); return; }
            ysdk.adv.showRewardedVideo({
                callbacks: {
                    onRewarded: () => { doRevive(); },
                    onError: (err) => { console.warn('Ошибка рекламы', err); }
                }
            });
        }

        function doRevive() {
            reviveUsedThisLife = true;
            isGameOver = false;
            gameOverUI.style.display = 'none';
            document.getElementById('btnRevive').style.display = 'none';

            const center = getPlayerCenter();
            player.cells = [{
                x: center.x, y: center.y, vx: 0, vy: 0,
                radius: 20, mass: Math.max(targetMassForNextGalaxy * 0.15, 20)
            }];

            player.invulnerableUntil = performance.now() + 2000;
            updateUI();
            gameplayStart();
            lastFrameTime = 0;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(animate);
        }

        function watchAdForDoubleGems() {
            if (doubleGemsClaimed) return;
            if (!ysdk || !ysdk.adv) {
                applyDoubleGems();
                return;
            }
            ysdk.adv.showRewardedVideo({
                callbacks: {
                    onRewarded: () => {
                        applyDoubleGems();
                    },
                    onError: (err) => {
                        console.warn('Ошибка показа рекламы для удвоения', err);
                    }
                }
            });
        }

        function applyDoubleGems() {
            doubleGemsClaimed = true;
            const earnedNow = parseInt(document.getElementById('finalGems').innerText) || 0;
            gems += earnedNow; 
            saveMeta();
            
            document.getElementById('finalGems').innerText = gems;
            document.getElementById('btnDoubleGems').style.display = 'none';
        }

        function drawBoss() {
            if (!boss) return;
            if (!isOnScreen(boss.x, boss.y, boss.radius + 60)) return;

            const age = performance.now() - (boss.spawnTime || 0);
            const fadeAlpha = Math.min(age / 1200, 1);

            const canEat = player.level >= boss.level;
            const color = canEat ? '#00ff88' : '#ff0844';
            const auraColor = getGalaxyPalette(galaxy).armColor;

            ctx.save();
            ctx.globalAlpha = fadeAlpha;

            ctx.save();
            ctx.translate(boss.x, boss.y);
            ctx.rotate(performance.now() / 800);
            ctx.beginPath();
            ctx.arc(0, 0, boss.radius + 16, 0, Math.PI * 1.5);
            ctx.strokeStyle = auraColor; ctx.lineWidth = 5;
            setGlow(14, auraColor);
            ctx.stroke();
            ctx.restore();

            ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#030a12'; ctx.strokeStyle = color; ctx.lineWidth = 4;
            setGlow(20, color); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;

            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(`👑 ${t('bossLabel')} ${t('enemyLevelShort')}${boss.level}`, boss.x, boss.y - boss.radius - 18);

            ctx.restore();
        }

        function drawEnemyBadge(x, y, radius, level, isWeak) {
            ctx.save();
            const badgeY = y - radius - 14;
            const badgeColor = isWeak ? '#00ff88' : '#ff0844';

            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.beginPath(); 
            if (ctx.roundRect) {
                ctx.roundRect(x - 22, badgeY - 8, 44, 16, 5);
            } else {
                ctx.rect(x - 22, badgeY - 8, 44, 16);
            }
            ctx.fill();
            ctx.strokeStyle = badgeColor; ctx.lineWidth = 1; ctx.stroke();

            ctx.fillStyle = badgeColor; ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(`${t('enemyLevelShort')} ${level}`, x, badgeY);
            ctx.restore();
        }

        function drawOffscreenIndicators() {
            const center = getPlayerCenter();

            enemies.forEach(e => {
                if (e.level > player.level * 1.8 || e.type === 'mina') {
                    const dx = e.x - center.x;
                    const dy = e.y - center.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist > width / 2) {
                        const angle = Math.atan2(dy, dx);
                        const margin = 40;
                        const edgeX = width / 2 + Math.cos(angle) * (width / 2 - margin);
                        const edgeY = height / 2 + Math.sin(angle) * (height / 2 - margin);

                        ctx.save();
                        ctx.translate(edgeX, edgeY);
                        ctx.rotate(angle);

                        ctx.beginPath();
                        ctx.moveTo(12, 0); ctx.lineTo(-10, -8); ctx.lineTo(-10, 8);
                        ctx.closePath();
                        ctx.fillStyle = e.type === 'mina' ? '#ffcc00' : '#ff0844';
                        setGlow(10, ctx.fillStyle);
                        ctx.fill();
                        ctx.restore();
                    }
                }
            });

            if (boss) {
                const dx = boss.x - center.x;
                const dy = boss.y - center.y;
                const dist = Math.hypot(dx, dy);

                if (dist > width / 2) {
                    const angle = Math.atan2(dy, dx);
                    const margin = 40;
                    const edgeX = width / 2 + Math.cos(angle) * (width / 2 - margin);
                    const edgeY = height / 2 + Math.sin(angle) * (height / 2 - margin);

                    ctx.save();
                    ctx.translate(edgeX, edgeY);
                    ctx.rotate(angle);
                    ctx.beginPath();
                    ctx.moveTo(16, 0); ctx.lineTo(-12, -10); ctx.lineTo(-12, 10);
                    ctx.closePath();
                    ctx.fillStyle = '#ffcc00';
                    setGlow(14, '#ffcc00');
                    ctx.fill();
                    ctx.restore();

                    ctx.save();
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('👑', edgeX - Math.cos(angle) * 24, edgeY - Math.sin(angle) * 24);
                    ctx.restore();
                }
            }
        }

        function drawPortalPointer() {
            if (!portal) return;
            const center = getPlayerCenter();
            const dx = portal.x - center.x;
            const dy = portal.y - center.y;
            const dist = Math.hypot(dx, dy);

            if (dist > height / 2 - 50) {
                const angle = Math.atan2(dy, dx);
                const pointerDist = Math.min(width, height) / 2 - 40;
                const arrowX = width / 2 + Math.cos(angle) * pointerDist;
                const arrowY = height / 2 + Math.sin(angle) * pointerDist;

                ctx.save();
                ctx.translate(arrowX, arrowY);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(15, 0); ctx.lineTo(-10, -10); ctx.lineTo(-5, 0); ctx.lineTo(-10, 10);
                ctx.closePath();
                ctx.fillStyle = '#00f2fe';
                setGlow(10, '#00f2fe');
                ctx.fill();
                ctx.restore();
            }
        }

        function drawMinimap() {
            miniCtx.clearRect(0, 0, 110, 110);
            miniCtx.fillStyle = 'rgba(3, 12, 22, 0.85)';
            miniCtx.fillRect(0, 0, 110, 110);

            const scale = 0.025; const cx = 55; const cy = 55;
            const center = getPlayerCenter();

            miniCtx.fillStyle = '#00f2fe'; miniCtx.beginPath();
            miniCtx.arc(cx, cy, 3, 0, Math.PI * 2); miniCtx.fill();

            if (portal) {
                const px = cx + (portal.x - center.x) * scale;
                const py = cy + (portal.y - center.y) * scale;
                miniCtx.fillStyle = '#ff00ff'; miniCtx.beginPath();
                miniCtx.arc(px, py, 5, 0, Math.PI * 2); miniCtx.fill();
            }

            if (boss) {
                const bx = cx + (boss.x - center.x) * scale;
                const by = cy + (boss.y - center.y) * scale;
                miniCtx.fillStyle = '#ffcc00'; miniCtx.beginPath();
                miniCtx.arc(bx, by, 4, 0, Math.PI * 2); miniCtx.fill();
            }

            enemies.forEach(e => {
                const mx = cx + (e.x - center.x) * scale;
                const my = cy + (e.y - center.y) * scale;
                if (mx > 0 && mx < 110 && my > 0 && my < 110) {
                    miniCtx.fillStyle = e.type === 'mina' ? '#ffcc00' : (player.level >= e.level ? '#00ff88' : '#ff0844');
                    miniCtx.beginPath(); miniCtx.arc(mx, my, e.type === 'hunter' ? 2.5 : 1.8, 0, Math.PI * 2); miniCtx.fill();
                }
            });
        }

        function drawGalaxyCoreAndArms() {
            const palette = getGalaxyPalette(galaxy);
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            let coreGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 800);
            coreGrad.addColorStop(0, palette.core);
            coreGrad.addColorStop(0.2, palette.armColor);
            coreGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = coreGrad;
            ctx.beginPath(); ctx.arc(0, 0, 800, 0, Math.PI * 2); ctx.fill();

            spiralArms.forEach(pt => {
                if (!isOnScreen(pt.x, pt.y, pt.radius)) return;
                let armGrad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, pt.radius);
                armGrad.addColorStop(0, palette.armColor);
                armGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = armGrad;
                ctx.globalAlpha = pt.alpha;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2); ctx.fill();
            });

            ctx.restore();
        }

        function drawFarGalaxies() {
            farGalaxies.forEach(g => {
                if (!isOnScreen(g.x, g.y, g.radius * 1.6)) return;
                ctx.save();
                ctx.translate(g.x, g.y);
                ctx.rotate(g.rotation);
                let grad = ctx.createRadialGradient(0, 0, 0, 0, 0, g.radius);
                grad.addColorStop(0, g.colorCore);
                grad.addColorStop(0.45, g.colorEdge);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.ellipse(0, 0, g.radius, g.radius * 0.32, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawPlanets() {
            planets.forEach(p => {
                if (!isOnScreen(p.x, p.y, p.radius * 2.5)) return;
                ctx.save();
                let pGrad = ctx.createLinearGradient(p.x - p.radius, p.y - p.radius, p.x + p.radius, p.y + p.radius);
                pGrad.addColorStop(0, p.colors[0]); pGrad.addColorStop(0.5, p.colors[1]); pGrad.addColorStop(1, p.colors[2]);

                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = pGrad; setGlow(18, p.colors[0]); ctx.fill();

                if (p.hasRing) {
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.radius * 2.1, p.radius * 0.42, p.ringAngle, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(160, 190, 210, 0.35)'; ctx.lineWidth = p.radius * 0.11; ctx.stroke();
                    ctx.strokeStyle = 'rgba(210, 230, 255, 0.18)'; ctx.lineWidth = p.radius * 0.03; ctx.stroke();
                }
                ctx.restore();
            });
        }

        function drawDarkNebulas() {
            if (lowGraphics) return;
            ctx.save();
            ctx.globalCompositeOperation = 'multiply';
            ctx.fillStyle = 'rgba(1, 4, 10, 0.75)';
            darkNebulas.forEach(dn => {
                if (!isOnScreen(dn.x, dn.y, dn.radius)) return;
                ctx.beginPath();
                ctx.ellipse(dn.x, dn.y, dn.radius, dn.radius * 0.55, dn.rotation, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            const palette = getGalaxyPalette(galaxy);
            const now = performance.now();

            let bgGrad = ctx.createRadialGradient(width / 2, height / 2, 50, width / 2, height / 2, Math.max(width, height));
            bgGrad.addColorStop(0, palette.bg[1]);
            bgGrad.addColorStop(0.6, palette.bg[0]);
            bgGrad.addColorStop(1, palette.bg[2]);
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, width, height);

            ctx.save(); 
            
            if (shakeTime > 0) {
                const offsetX = (Math.random() - 0.5) * shakeTime;
                const offsetY = (Math.random() - 0.5) * shakeTime;
                ctx.translate(-camera.x + offsetX, -camera.y + offsetY);
            } else {
                ctx.translate(-camera.x, -camera.y);
            }

            drawGalaxyCoreAndArms();
            drawFarGalaxies();

            backgroundNebulas.forEach(n => {
                if (!isOnScreen(n.x, n.y, n.radius)) return;
                let grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.radius);
                grad.addColorStop(0, n.color); grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2); ctx.fill();
            });

            drawDarkNebulas();

            backgroundStars.forEach(star => {
                if (!isOnScreen(star.x, star.y, 20)) return;
                const twinkle = Math.sin(now * star.twinkleSpeed + star.phase) * 0.35 + 0.65;
                ctx.fillStyle = star.color;
                ctx.globalAlpha = star.alpha * twinkle;
                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill();

                if (star.hasFlare) {
                    ctx.strokeStyle = star.color; ctx.lineWidth = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(star.x - star.size * 3.5, star.y); ctx.lineTo(star.x + star.size * 3.5, star.y);
                    ctx.moveTo(star.x, star.y - star.size * 3.5); ctx.lineTo(star.x, star.y + star.size * 3.5);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
            });

            spaceDust.forEach(d => {
                if (isOnScreen(d.x, d.y, 10)) {
                    ctx.fillStyle = d.color;
                    ctx.fillRect(d.x, d.y, d.size, d.size);
                }
            });

            drawPlanets();

            foods.forEach(food => {
                if (!isOnScreen(food.x, food.y, 20)) return;
                ctx.beginPath(); ctx.arc(food.x, food.y, food.radius, 0, Math.PI * 2);
                ctx.fillStyle = food.color; ctx.fill();
            });

            gemsItems.forEach(gem => {
                if (!isOnScreen(gem.x, gem.y, 20)) return;
                ctx.beginPath(); ctx.arc(gem.x, gem.y, gem.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#d000ff'; setGlow(7, '#d000ff'); ctx.fill(); ctx.shadowBlur = 0;
            });

            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`; ctx.fill();
            });

            if (portal) {
                ctx.beginPath(); ctx.arc(portal.x, portal.y, portal.radius, 0, Math.PI * 2);
                let pGrad = ctx.createRadialGradient(portal.x, portal.y, 5, portal.x, portal.y, portal.radius);
                pGrad.addColorStop(0, '#ffffff'); pGrad.addColorStop(0.4, '#00f2fe'); pGrad.addColorStop(1, '#ff0844');
                ctx.fillStyle = pGrad; setGlow(22, '#00f2fe'); ctx.fill(); ctx.shadowBlur = 0;
            }

            enemies.forEach(enemy => {
                if (!isOnScreen(enemy.x, enemy.y, enemy.radius + 20)) return;
                const canEat = player.level >= enemy.level;
                let enemyColor = canEat ? '#00ff88' : '#ff0844';

                ctx.save();
                if (enemy.type === 'stealth') {
                    const center = getPlayerCenter();
                    const dist = Math.hypot(center.x - enemy.x, center.y - enemy.y);
                    ctx.globalAlpha = dist < 220 ? 0.8 : 0.15;
                    enemyColor = '#c279ff';
                }

                if (enemy.type === 'mina') {
                    enemyColor = '#ffcc00';
                    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#1a0f00'; ctx.strokeStyle = enemyColor; ctx.lineWidth = 3;
                    setGlow(10, enemyColor); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#ffcc00'; ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('💣', enemy.x, enemy.y);
                } else {
                    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#030a12'; ctx.strokeStyle = enemyColor; ctx.lineWidth = enemy.type === 'hunter' ? 3.5 : 2.5;
                    setGlow(8, enemyColor); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
                    drawEnemyBadge(enemy.x, enemy.y, enemy.radius, enemy.level, canEat);
                }
                ctx.restore();
            });

            drawBoss();

            if (!isGameOver && player.cells) {
                const isStealthActive = now < stealthActiveUntil;
                const isAbsorbActive = now < absorbActiveUntil;
                const flashing = player.invulnerableUntil && now < player.invulnerableUntil && Math.floor(now / 100) % 2 === 0;
                
                let baseAlpha = isStealthActive ? 0.35 : 1.0;
                if (flashing) baseAlpha *= 0.5;

                ctx.globalAlpha = baseAlpha;
                const skinColor = isStealthActive ? '#ffffff' : '#00f2fe';

                player.cells.forEach(cell => {
                    if (isAbsorbActive) {
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(cell.x, cell.y, 220, 0, Math.PI * 2);
                        ctx.strokeStyle = 'rgba(0, 242, 254, 0.25)';
                        ctx.lineWidth = 2;
                        setGlow(10, '#00f2fe');
                        ctx.stroke();
                        ctx.restore();
                    }

                    ctx.beginPath(); ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = skinColor; ctx.lineWidth = 3;
                    setGlow(14, skinColor); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;

                    ctx.fillStyle = '#000'; ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(`${t('enemyLevelShort')}${Math.floor(cell.mass / 10)}`, cell.x, cell.y);
                });

                ctx.globalAlpha = 1.0;
            }

            ctx.restore();

            drawPortalPointer();
            drawOffscreenIndicators();

            if (isWarping) {
                ctx.fillStyle = `rgba(2, 9, 18, ${Math.min(warpTimer, 1.0)})`;
                ctx.fillRect(0, 0, width, height);
            }

            drawMinimap();
        }

        function animate(now) {
            if (!lastFrameTime) lastFrameTime = now;
            let dt = (now - lastFrameTime) / (1000 / 60);
            dt = Math.min(Math.max(dt, 0), 3);
            lastFrameTime = now;

            if (!isPaused) { update(dt); draw(); }
            if (!isGameOver && startMenu.style.display === 'none') {
                animFrameId = requestAnimationFrame(animate);
            }
        }

        (async function bootstrap() {
            await initYandexSDK();
            await loadMeta();
            applyLocalization();
            updateMenuUI();
            checkDailyBonus();
        })();
    </script>
</body>
